name: Build & Release (main)

on:
  push:
    # 测试验证在 feature/develop 上触发即可（不再为跑测试推 main）；
    # 正式 Release 制品仅由 main 推送创建（见 Create GitHub Release 的 ref 门控）。
    branches: [main, develop, 'feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # 2026-11-10 临时覆盖：registry.npmmirror.com 从 GitHub runner 持续 5xx/超时，
        # 仅本步骤改用官方源；锁文件与完整性校验不变，镜像恢复后还原。
        env:
          npm_config_registry: https://registry.npmjs.org
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, test and build
        run: NODE_OPTIONS="--max-old-space-size=2048" sh -c 'pnpm typecheck && pnpm lint && pnpm test && pnpm build'

      - name: Package dist artifacts
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # 版本化命名直接落盘（0.2.1 惯例 sw-web-dist-<version>.zip），发布资产按名上传，
          # 避免 gh 的 file#label 标签语法在 runner 上不生效导致命名退化。
          zip -r "sw-web-dist-${VERSION}.zip" dist
          echo "sha_full=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # 分支触发只做测试/制品构建验证；tag+Release 制品仅由 main 发布。
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_SHA}"
          # 固定发布目标：tag 与本次构建提交（完整 SHA）绑定，main 后续推进不改变目标。
          # 查询既有 tag 目标（仅 fetch 引用，不创建）。查询失败（网络/远端异常）必须
          # 停止发布——不得把查询失败当作无 tag 继续，避免在未知状态下删除/重建 Release。
          EXISTING_TAG_TARGET=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')
          if [ -n "${EXISTING_TAG_TARGET}" ] && [ "${EXISTING_TAG_TARGET}" != "${GITHUB_SHA}" ]; then
            echo "::error::tag ${TAG} 已指向其他提交 ${EXISTING_TAG_TARGET}，拒绝覆盖其他提交的发行物"
            exit 1
          fi
          # 同提交重跑：仅删除既有 Release（保留 tag），随后重建；不删除其他 tag/Release。
          gh release view "${TAG}" >/dev/null 2>&1 && gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --latest=false \
            --title "CH-aPaaS-Web ${{ steps.package.outputs.version }} build ${GITHUB_SHA}" \
            --notes "自动构建产物（提交 ${GITHUB_SHA}，分支 main）" \
            "sw-web-dist-${{ steps.package.outputs.version }}.zip"